# .github/workflows/crawl_update.yml
name: Musinsa Daily Auto Crawler

on:
  schedule:
    # KST 기준: 06:00, 12:00, 18:00, 24:00 (UTC: 21, 03, 09, 15)
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # 수동 실행 유지

jobs:
  crawl-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 구성
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 우분투 크롬 브라우저 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 패키지 설치
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 크롤러 실행 (남성/여성 랭킹 및 일반 데이터 수집)
        run: |
          python bulk_crawler.py

      - name: 갱신된 clothes_db.csv 자동 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clothes_db.csv
          if git diff --staged --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "chore: 무신사 실시간 랭킹 & 의류 DB 자동 갱신"
            git push
          fi